[versions]
agp = "9.3.2"
kotlin = "2.4.10"

activity = "1.13.0"
core = "1.19.0"
compose = "1.12.0"
kyantShapes = "1.2.1"
liquidkit = "1.0.0-alpha.3"
backdrop = "2.0.1-liquidkit.1"
materialIcons = "1.7.8"
junit = "4.13.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "core" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "materialIcons" }
compose-animation = { group = "org.jetbrains.compose.animation", name = "animation", version.ref = "compose" }
compose-foundation = { group = "org.jetbrains.compose.foundation", name = "foundation", version.ref = "compose" }
compose-ui = { group = "org.jetbrains.compose.ui", name = "ui", version.ref = "compose" }
compose-ui-graphics = { group = "org.jetbrains.compose.ui", name = "ui-graphics", version.ref = "compose" }
kyant-shapes = { group = "io.github.kyant0", name = "shapes", version.ref = "kyantShapes" }
liquidkit-android = { group = "io.liquidkit", name = "liquidkit-android", version.ref = "liquidkit" }
backdrop-android = { group = "io.github.kyant0", name = "backdrop-android", version.ref = "backdrop" }
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
